name: Schedule Healthcheck

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Print schedule heartbeat
        run: |
          echo "Schedule healthcheck fired."
          date -u
