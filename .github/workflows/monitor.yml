name: Chrome Hearts Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send a LINE test notification even when there is no site change'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: chromehearts-monitor
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Tokyo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        if: ${{ github.event.inputs.force_notify != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run LINE test notification
        if: ${{ github.event.inputs.force_notify == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node src/line-test.js

      - name: Run monitor
        if: ${{ github.event.inputs.force_notify != 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: npm run monitor

      - name: Commit monitor state
        if: ${{ always() && github.event.inputs.force_notify != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/latest-homepage.png package-lock.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Chrome Hearts monitor state"
            git push
          fi
